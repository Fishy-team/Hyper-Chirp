<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/dark.styles.css" />
  <script src="js/script.js"></script>
</head>
<body>
  <header>
  </header>
  </main>
  <div>
    <nav>
    <ul>
      <li><h4>The Pond</h4></li>
      <li><h4>A place for every school of thought</h4></li>
      <li>
        <img id="msg-bottle" src="assets/message-in-a-bottle.png" alt="Messages"/>     
        <img id="diver" src="assets/diver.png" alt="profile"/>
      </li>
    </nav>
    <div>
    <!--content-->

    <!--content-->
    <div>
  <main class="pond-workspace">
  <aside class="left-sidebar" aria-label="Pond sidebar">
    <div class="left-sidebar-top">
      <nav class="pond-nav">
        <a href="#pond" class="pond-nav-item active">
          <span class="pond-nav-icon" aria-hidden="true">🏠</span>
          <span>The pond</span>
        </a>
        <a href="#my-thoughts" class="pond-nav-item">
          <span class="pond-nav-icon" aria-hidden="true">💭</span>
          <span>My thoughts</span>
        </a>
      </nav>

      <button type="button" id="shareThoughtBtn" class="share-thought-btn">
        <span aria-hidden="true">✏️</span>
        <span>Share a thought</span>
      </button>

      <section class="your-corner" aria-label="Your little corner">
        <div class="your-corner-heading">
          <span>Your little corner</span>
          <span aria-hidden="true">✨</span>
        </div>

        <div class="university-box">
          <div class="university-title">
            <span class="hi-logo-badge" aria-hidden="true">HI</span>
            <span>Hyper Island</span>
          </div>
          <p class="university-sub">One campus. Many currents.</p>
          <span class="students-pill">
            <span aria-hidden="true">🎓</span>
            <span>Students only</span>
          </span>
        </div>
      </section>
    </div>

    <div class="left-sidebar-bottom">
      <div class="pond-vibe-note">
        <div class="fish-nap" aria-hidden="true">
          <span class="fish-emoji">🐠</span>
          <span class="fish-zzz">Z<sup>z<sup>z</sup></sup></span>
        </div>
        <p class="vibe-quote">“Less noise.<br />More connection.”</p>
        <p class="vibe-desc">Just thoughts and vibes.<br />No reposts. No pressure.</p>
        <div class="vibe-links">
          <a href="#community-care">Community care</a>
          <span>•</span>
          <a href="#privacy">Privacy</a>
        </div>
      </div>

      <div class="sidebar-controls">
        <button type="button" class="sidebar-gear-btn" aria-label="Settings">
          <span aria-hidden="true">⚙️</span>
          <span>Settings</span>
        </button>
        <button type="button" class="sidebar-mode-pill">
          <span aria-hidden="true">📖</span>
          <span>Study Mode</span>
        </button>
      </div>
    </div>
  </aside>
</main>
    </div>
