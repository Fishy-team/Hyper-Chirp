<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Pond</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/script.js"></script>
</head>
<body>
  <header>
  </header>
  </main>
  <div>
    <nav>
    <ul>
      <li><h4 class="logo">The Pond</h4></li>
      <li><h4>A place for every school of thought</h4></li>
      <li><input type="button" class="button" value="+ new post"></li> <!--link, click to open post-->
    </ul>
    </nav>
  
    <div>
      <!--content-->

      <div>
        <!--left column-->
      </div>
      
      
      <section class="feed-column"> <!--center column-->

        <div class="foryou">
          <!--For you box-->
          <h2>For you</h2>
        </div>

        <div class="card editor-box">
          <div class="editor-top">
            <div class="fish-avatar">🐡</div>
            <textarea class="post-input" placeholder="What's happening at the campus?" maxlength="280"></textarea>
          </div>

          <div class="editor-feelings">
            <span>Feeling (optional):</span>
            <button type="button" class="mood-btn" data-tag="Happy">😊Happy</button>
            <button type="button" class="mood-btn" data-tag="Sad">😔Sad</button>
            <button type="button" class="mood-btn" data-tag="Tired">🫩Tired</button>
            <button type="button" class="mood-btn" data-tag="Stressed">😟Stressed</button>
            <button type="button" class="mood-btn" data-tag="Excited">😃Excited</button>
            <button type="button" class="mood-btn" data-tag="Chill">😎Chill</button>
          </div>

          <div class="editor-bottom">
            <label class="anonymous-label">
              <input type="checkbox" class="anonymous-checkbox" />
              Post anonymously
            </label>
            <button type="button" class="post-btn">Post</button>
          </div>
        </div>
        

      </section>

    
      <div>
        <!--right column-->
      </div>

    </div>
  </div>
</body>
</html>
